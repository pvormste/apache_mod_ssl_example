# mTLS-secured upstream server
# This server requires client certificates and serves a protected resource

Listen 443
LogLevel debug

LoadModule ssl_module modules/mod_ssl.so
LoadModule headers_module modules/mod_headers.so

<VirtualHost *:443>
    ServerName mtls-upstream

    SSLEngine on
    SSLCertificateFile      /usr/local/apache2/certs/upstream-server.crt
    SSLCertificateKeyFile   /usr/local/apache2/certs/upstream-server.key

    # CA used to validate client certificates
    SSLCACertificateFile    /usr/local/apache2/certs/upstream-ca.crt

    # Verbose SSL logging
    LogLevel ssl:trace8

    # Require client certificates (mTLS)
    SSLVerifyClient require
    SSLVerifyDepth 2

    DocumentRoot /usr/local/apache2/htdocs

    # Simple endpoint that returns JSON
    <Location "/protected">
        Header set Content-Type "application/json"
        <RequireAll>
            Require all granted
        </RequireAll>
    </Location>

    ErrorLog logs/error.log
    CustomLog logs/access.log combined
</VirtualHost>
