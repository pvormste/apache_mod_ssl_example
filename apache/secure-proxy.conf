# Apache SSL VirtualHost that enforces mTLS and proxies /secure-json to backend
# Designed for the official httpd image (paths under /usr/local/apache2)

Listen 443
LogLevel debug

# Load modules (httpd image includes these as shared modules)
LoadModule ssl_module modules/mod_ssl.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule headers_module modules/mod_headers.so
LoadModule rewrite_module modules/mod_rewrite.so

<VirtualHost *:443>
    ServerName localhost

    SSLEngine on
    SSLCertificateFile      /usr/local/apache2/certs/server.crt
    SSLCertificateKeyFile   /usr/local/apache2/certs/server.key

    # CA used to validate client certificates
    SSLCACertificateFile    /usr/local/apache2/certs/ca.crt

    # Turn on very verbose SSL logging while we debug handshake problems
    LogLevel ssl:trace8

    # Strict mTLS
    SSLVerifyClient require
    SSLVerifyDepth 2

    # Allow proxying over SSL
    SSLProxyEngine on

    # mTLS CLIENT CONFIGURATION
    # Configure client certificates for connecting to mTLS-secured upstreams
    # This allows Apache to authenticate itself when proxying to services that require client certs
    SSLProxyMachineCertificateFile /usr/local/apache2/certs/proxy-client-bundle.pem
    
    # Verify the upstream server's certificate
    SSLProxyVerify require
    SSLProxyVerifyDepth 2
    SSLProxyCACertificateFile /usr/local/apache2/certs/upstream-ca.crt

    # Forward client cert to backend if needed
    RequestHeader set X-Client-Cert "%{SSL_CLIENT_CERT}s"

    ProxyPreserveHost On
    
    # Existing proxy to non-mTLS backend (PRESERVED)
    ProxyPass        "/secure-json" "http://json-backend:80/myfile.json"
    ProxyPassReverse "/secure-json" "http://json-backend:80/myfile.json"

    # NEW: Proxy to mTLS-secured upstream
    # This endpoint connects to the upstream service using client certificates
    ProxyPass        "/mtls-upstream" "https://mtls-upstream:443/protected.json"
    ProxyPassReverse "/mtls-upstream" "https://mtls-upstream:443/protected.json"

    ErrorLog logs/error.log
    CustomLog logs/access.log combined

    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
</VirtualHost>

# Redirect HTTP to HTTPS (optional)
<VirtualHost *:80>
    ServerName localhost
    Redirect permanent / https://localhost/
</VirtualHost>
