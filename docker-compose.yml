services:
  apache:
    build:
      context: ./apache
    ports:
      - "9443:443"
    depends_on:
      - json-backend
      - mtls-upstream
    volumes:
      # Mount certs into the httpd layout expected by the Dockerfile/config.
      - ./certs:/usr/local/apache2/certs:ro
    restart: unless-stopped

  json-backend:
    image: nginx:stable-alpine
    volumes:
      - ./backend:/usr/share/nginx/html:ro
    restart: unless-stopped

  # NEW: mTLS-secured upstream service
  # This service requires client certificates (acts as mTLS server)
  # Apache will connect to this service as an mTLS client
  mtls-upstream:
    build:
      context: ./mtls-upstream
    volumes:
      - ./certs:/usr/local/apache2/certs:ro
      - ./mtls-upstream/htdocs:/usr/local/apache2/htdocs:ro
    restart: unless-stopped
